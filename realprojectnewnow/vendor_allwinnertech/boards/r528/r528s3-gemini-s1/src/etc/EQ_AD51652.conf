#EQ
#PreGainDB = 0
#GlobalEnable = False
#PlatformIC = 0
#Band = 10

#### Basic parameters ####
channels=2 # set according to file format 
dump_flag=1 # dump params of struct eq_prms_t@eq.c
enabled=1 # 1:enable awequal,0:disable
bin_num=7 #no. of bands
samplerate=44100 #should be equal to formats of audio flie

#### Core parameters ####
#[BQn]: nth biquad filter
#type 0:Low pass shelving filter
#     1:Band pass peak filter
#     2:High pass shelving filter
#     3:Low pass filter
#     4:High pass filter
#frequency  : frequency point
#gain       :{-15}db ~ {15}db
#quality : 0.1-20
#FilterType       Fc      Gain        Quality 
#BQ1
#FilterType = 0, Fc = 20000, G = -7, Q = 1, Enable = True
params=0 20000 -7 1
#BQ2
#FilterType = 1, Fc = 200, G = 4, Q = 1.2, Enable = True
params=1 200 4 1.2
#BQ3
#FilterType = 1, Fc = 100, G = 6, Q = 1, Enable = True
params=1 100 6 1
#BQ4
#FilterType = 1, Fc = 1600, G = 5, Q = 3.4, Enable = True
params=1 1600 5 3.4
#BQ5
#FilterType = 1, Fc = 9000, G = 5, Q = 3.4, Enable = True
params=1 9000 5 3.4
#BQ6
#FilterType = 1, Fc = 2500, G = -3, Q = 2, Enable = True
params=1 2500 -3 2
#BQ7
#FilterType = 4, Fc = 80, G = 0, Q = 1, Enable = True
params=4 80 0 1
#BQ8
#FilterType = 1, Fc = 720, G = -6, Q = 0.5, Enable = False
#params=1 720 -6 0.5
#BQ9
#FilterType = 1, Fc = 840, G = 2, Q = 3, Enable = False
#params=1 840 2 3
#BQ10
#FilterType = 1, Fc = 1024, G = 0, Q = 0.1, Enable = False
#params=1 1024 0 0.1
#BQ11
#FilterType = 1, Fc = 1440, G = 1, Q = 3, Enable = True
#params=1 1440 1 3
#BQ12
#FilterType = 1, Fc = 2000, G = -1, Q = 2, Enable = True
#params=1 2000 -1 2
#BQ13
#FilterType = 2, Fc = 2500, G = -10, Q = 1, Enable = True
#params=2 2500 -10 1
#BQ14
#FilterType = 1, Fc = 3200, G = -6, Q = 4, Enable = True
#params=1 3200 -6 4
#BQ15
#FilterType = 1, Fc = 4000, G = 0, Q = 4, Enable = True
#params=1 4000 0 4
#BQ16
#FilterType = 1, Fc = 5000, G = 2, Q = 2, Enable = True
#params=1 5000 2 2
#BQ17
#FilterType = 1, Fc = 6400, G = -3, Q = 0.5, Enable = True
#params=1 6400 -3 0.5
#BQ18
#FilterType = 1, Fc = 8400, G = -3, Q = 0.2, Enable = True
#params=1 8400 -3 0.2
#BQ19
#FilterType = 1, Fc = 14400, G = 3, Q = 0.1, Enable = True
#params=1 14400 3 0.1
