#Band = 10

#### Basic parameters ####
channels=1 # set according to file format 
dump_flag=1 # dump params of struct eq_prms_t@eq.c
enabled=1 # 1:enable awequal,0:disable
bin_num=10 #no. of bands
samplerate=44100 #should be equal to formats of audio flie

#### Core parameters ####
#[BQn]: nth biquad filter
#type 0:Low pass shelving filter
#     1:Band pass peak filter
#     2:High pass shelving filter
#     3:Low pass filter
#     4:High pass filter
#frequency  : frequency point
#gain       :{-15}db ~ {15}db
#quality : 0.1-20
#FilterType       Fc      Gain        Quality 
#BQ1
#FilterType = 0, Fc = 20000, G = -8, Q = 1, Enable = True
params=0 20000 -8 1
#BQ2
#FilterType = 1, Fc = 350, G = -2, Q = 3, Enable = True
params=1 350 -2 3
#BQ3
#FilterType = 1, Fc = 100, G = 8, Q = 1.2, Enable = True
params=1 100 8 1.2
#BQ4
#FilterType = 1, Fc = 1200, G = 4, Q = 3.5, Enable = True
params=1 1200 4 3.5
#BQ5
#FilterType = 1, Fc = 15000, G = 6, Q = 0.8, Enable = True
params=1 15000 6 0.8
#BQ6
#FilterType = 1, Fc = 2200, G = -2, Q = 3, Enable = True
params=1 2200 -2 3
#BQ7
#FilterType = 4, Fc = 75, G = 0, Q = 0.7, Enable = True
params=4 75 0 0.7
#BQ8
#FilterType = 1, Fc = 250, G = -5, Q = 2.5, Enable = True
params=1 250 -5 2.5
#BQ9
#FilterType = 1, Fc = 3800, G = 6, Q = 1.5, Enable = True
params=1 3800 6 1.5
#BQ10
#FilterType = 1, Fc = 9000, G = 4, Q = 0.8, Enable = True
params=1 9000 4 0.8
